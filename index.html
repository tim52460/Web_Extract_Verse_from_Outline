<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>恢復本經文擷取</title>
<script>
function showFatal(msg) {
  var b = document.getElementById("fatal");
  if (b) { b.hidden = false; b.textContent = "程式發生錯誤：" + msg + "\n（請重新整理；若仍出現，請把這段文字貼給我）"; }
}
window.addEventListener("error", function (e) { showFatal(e.message || String(e.error)); });
window.addEventListener("unhandledrejection", function (e) { showFatal(String(e.reason && e.reason.message || e.reason)); });
</script>
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --ink: #1f2328; --muted: #656d76; --line: #d8d6cf;
    --accent: #2f6f5e; --accent-ink: #ffffff; --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181a; --panel: #1f2225; --ink: #e6e6e3; --muted: #9aa0a6; --line: #343a3f;
      --accent: #5fb89f; --accent-ink: #0d1512; --ok: #56d364; --warn: #e3b341; --err: #ff7b72;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .9rem; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  textarea, input[type=text], input[type=number] { width: 100%; padding: 8px 10px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  textarea { min-height: 180px; resize: vertical; }
  textarea.mono, .log { font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row > * { flex: 0 0 auto; }
  .grow { flex: 1 1 200px !important; }
  button { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  .hint { color: var(--muted); font-size: .82rem; margin: 6px 0 0; }
  progress { width: 100%; height: 12px; accent-color: var(--accent); }
  .stat { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .log { height: 260px; overflow: auto; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; }
  .log .ok { color: var(--ok); } .log .warn { color: var(--warn); } .log .err { color: var(--err); }
  .log .dim { color: var(--muted); }
  select { padding: 7px 8px; background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; font: inherit; }
  .fatal { background: var(--err); color: #fff; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: .9rem; white-space: pre-wrap; }
  .chk { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; color: var(--ink); margin: 0; }
</style>
</head>
<body>
<main>
  <div id="fatal" class="fatal" role="alert" hidden></div>
  <h1>恢復本經文擷取</h1>
  <p class="sub">貼上含經文出處的大綱文字，自動找出每一節，到恢復本網站逐節擷取，並即時顯示進度與結果。</p>

  <section>
    <h2>1. 貼上文字</h2>
    <textarea id="input" placeholder="例如：讀經：創二二1～18，來十一17～19，羅四17" spellcheck="false"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="btnParse">解析預覽（不連線）</button>
      <label class="chk"><input type="checkbox" id="dedupe" checked> 同一節只擷取一次</label>
    </div>

    <details>
      <summary>連線設定（一般不用改）</summary>
      <label for="mode">取得方式</label>
      <select id="mode">
        <option value="auto">自動：讀取網站首頁的查詢表單</option>
        <option value="template">自訂：使用查詢網址樣板</option>
      </select>
      <label for="site">網站網址</label>
      <input type="text" id="site" value="https://recoveryversion.twgbr.org/">
      <div id="tplBox" hidden>
        <label for="tpl">查詢網址樣板（可用 {book} 全名、{abbr} 簡寫、{chapter}、{verse}）</label>
        <input type="text" id="tpl" placeholder="https://example.com/verse?b={abbr}&c={chapter}&v={verse}">
      </div>
      <label for="proxy">代理網址前綴（選填，會把目標網址編碼後接在後面）</label>
      <input type="text" id="proxy" placeholder="https://your-worker.workers.dev/?url=">
      <label for="delay">每節間隔（毫秒）</label>
      <input type="number" id="delay" value="300" min="0" step="100">
      <p class="hint">瀏覽器預設不允許網頁讀取其他網站，除非對方網站開放。按「測試連線」可以先確認這個網站能不能被讀取。</p>
      <div class="row" style="margin-top:10px"><button id="btnTest">測試連線</button></div>
    </details>
  </section>

  <section>
    <h2>2. 擷取</h2>
    <div class="row">
      <button id="btnStart" class="primary">開始擷取</button>
      <button id="btnStop" disabled>停止</button>
    </div>
    <div style="margin-top:12px">
      <progress id="bar" value="0" max="1"></progress>
      <div class="stat"><span id="statLeft">尚未開始</span><span id="statRight"></span></div>
    </div>
    <label>執行過程</label>
    <div id="log" class="log" role="log" aria-live="polite"></div>
  </section>

  <section>
    <h2>3. 結果</h2>
    <textarea id="result" class="mono" readonly placeholder="擷取到的經文會即時出現在這裡"></textarea>
    <label for="fname">存檔檔名（預設：文字前 10 個字＋_經文擷取.txt）</label>
    <div class="row">
      <input type="text" id="fname" class="grow">
      <button id="btnDownload" disabled>下載 .txt</button>
      <button id="btnCopy" disabled>複製全部</button>
    </div>
  </section>
</main>

<script>
/* PARSER-START */
/* 恢復本經文出處解析器：與 recovery_verses.py 的解析邏輯一致。
 * 已內嵌於 index.html；也可在 Node 以 require 載入做測試。
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.RV = api;
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  const OUTPUT_SUFFIX = "_經文擷取.txt";
  const NAME_CHARS = 10;
  const MAX_VERSE = 176; // 單章最多 176 節（詩一一九）
  const ERR_SOURCE = "出處來源有誤，請查看";
  const ERR_SCRAPE = "未抓取到經文，請查看";

  // [全名, 簡寫, 章數]
  const BOOKS = [
    ["創世記", "創", 50], ["出埃及記", "出", 40], ["利未記", "利", 27],
    ["民數記", "民", 36], ["申命記", "申", 34], ["約書亞記", "書", 24],
    ["士師記", "士", 21], ["路得記", "得", 4], ["撒母耳記上", "撒上", 31],
    ["撒母耳記下", "撒下", 24], ["列王紀上", "王上", 22], ["列王紀下", "王下", 25],
    ["歷代志上", "代上", 29], ["歷代志下", "代下", 36], ["以斯拉記", "拉", 10],
    ["尼希米記", "尼", 13], ["以斯帖記", "斯", 10], ["約伯記", "伯", 42],
    ["詩篇", "詩", 150], ["箴言", "箴", 31], ["傳道書", "傳", 12],
    ["雅歌", "歌", 8], ["以賽亞書", "賽", 66], ["耶利米書", "耶", 52],
    ["耶利米哀歌", "哀", 5], ["以西結書", "結", 48], ["但以理書", "但", 12],
    ["何西阿書", "何", 14], ["約珥書", "珥", 3], ["阿摩司書", "摩", 9],
    ["俄巴底亞書", "俄", 1], ["約拿書", "拿", 4], ["彌迦書", "彌", 7],
    ["那鴻書", "鴻", 3], ["哈巴谷書", "哈", 3], ["西番雅書", "番", 3],
    ["哈該書", "該", 2], ["撒迦利亞書", "亞", 14], ["瑪拉基書", "瑪", 4],
    ["馬太福音", "太", 28], ["馬可福音", "可", 16], ["路加福音", "路", 24],
    ["約翰福音", "約", 21], ["使徒行傳", "徒", 28], ["羅馬書", "羅", 16],
    ["哥林多前書", "林前", 16], ["哥林多後書", "林後", 13], ["加拉太書", "加", 6],
    ["以弗所書", "弗", 6], ["腓立比書", "腓", 4], ["歌羅西書", "西", 4],
    ["帖撒羅尼迦前書", "帖前", 5], ["帖撒羅尼迦後書", "帖後", 3],
    ["提摩太前書", "提前", 6], ["提摩太後書", "提後", 4], ["提多書", "多", 3],
    ["腓利門書", "門", 1], ["希伯來書", "來", 13], ["雅各書", "雅", 5],
    ["彼得前書", "彼前", 5], ["彼得後書", "彼後", 3], ["約翰一書", "約壹", 5],
    ["約翰二書", "約貳", 1], ["約翰三書", "約參", 1], ["猶大書", "猶", 1],
    ["啟示錄", "啟", 22],
  ];
  if (BOOKS.length !== 66) throw new Error("書卷表應有 66 卷");

  const ALIASES = { "啓": "啟示錄" }; // 異體字

  const BOOK_MAPPING = new Map();
  function register(key, info) {
    if (BOOK_MAPPING.has(key) && BOOK_MAPPING.get(key) !== info) {
      throw new Error("書卷名稱重複：" + key);
    }
    BOOK_MAPPING.set(key, info);
  }
  for (const [full, abbr, max] of BOOKS) {
    const info = { full, abbr, max };
    register(full, info);
    register(abbr, info);
  }
  for (const [alias, full] of Object.entries(ALIASES)) register(alias, BOOK_MAPPING.get(full));

  const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const alt = (keys) =>
    [...keys].sort((a, b) => b.length - a.length).map(escapeRe).join("|");

  const BOOK_ALT = alt(BOOK_MAPPING.keys());
  const SINGLE_ALT = alt([...BOOK_MAPPING].filter(([, v]) => v.max === 1).map(([k]) => k));

  // 章：中文數字（二二、十一）或阿拉伯數字加冒號（22:）；節：阿拉伯數字，「、」列舉、「～」範圍
  const CN = "[〇零一二三四五六七八九十百兩]+";
  const RANGE = "[～~〜\\-–－]";
  const SEG_PAT = `\\d+(?:${RANGE}(?:${CN}[:：]?)?\\d+)?`;
  const VS = `${SEG_PAT}(?:、${SEG_PAT})*`;
  const CHAP = `(?:(?<cn>${CN})[:：章]?|(?<ar>\\d+)[:：章])`;
  const FOOT = "(?<fn>[註注]\\d+(?:[、,]\\d+)*)?";
  const TAIL = `節?${FOOT}`;

  // y 旗標：只從 lastIndex 開始比對
  const FULL_RE = new RegExp(`(?<book>${BOOK_ALT})${CHAP}(?<vs>${VS})${TAIL}`, "y");
  const SINGLE_RE = new RegExp(`(?<book>${SINGLE_ALT})(?<vs>${VS})${TAIL}`, "y");
  const CV_RE = new RegExp(`${CHAP}(?<vs>${VS})${TAIL}`, "y");
  const BARE_RE = new RegExp(`(?<vs>${VS})節${FOOT}`, "y");
  const SEG_RE = new RegExp(`^(?<a>\\d+)(?:${RANGE}(?:(?<ec>${CN})[:：]?)?(?<b>\\d+))?$`);
  const SEP_RE = /\s*[，,；;]\s*/y;
  const DASHES = "—―─";

  const DIGITS = { "〇": 0, "零": 0, "一": 1, "二": 2, "兩": 2, "三": 3, "四": 4,
                   "五": 5, "六": 6, "七": 7, "八": 8, "九": 9 };

  function cnToInt(s) {
    if (/^\d+$/.test(s)) return parseInt(s, 10);
    if (s.includes("百") || s.includes("十")) {
      let total = 0, cur = 0;
      for (const ch of s) {
        if (ch === "百") { total += (cur || 1) * 100; cur = 0; }
        else if (ch === "十") { total += (cur || 1) * 10; cur = 0; }
        else cur = DIGITS[ch];
      }
      return total + cur;
    }
    return parseInt([...s].map((ch) => DIGITS[ch]).join(""), 10);
  }

  function matchAt(rx, line, pos) {
    rx.lastIndex = pos;
    return rx.exec(line);
  }
  const endOf = (m) => m.index + m[0].length;

  // Ref：{book, chapter, verse(null 表示出處有誤), tag}
  function expand(info, chap, vs) {
    const { full, abbr } = info;
    if (!(chap >= 1 && chap <= info.max)) {
      return [{ book: full, abbr, chapter: chap, verse: null, tag: `${abbr}${chap}:${vs}` }];
    }
    const out = [];
    for (const seg of vs.split("、")) {
      const bad = { book: full, abbr, chapter: chap, verse: null, tag: `${abbr}${chap}:${seg}` };
      const sm = SEG_RE.exec(seg);
      if (!sm || sm.groups.ec) { out.push(bad); continue; } // 跨章範圍無法離線展開
      const a = parseInt(sm.groups.a, 10);
      const b = sm.groups.b ? parseInt(sm.groups.b, 10) : a;
      if (!(a >= 1 && a <= b && b <= MAX_VERSE)) { out.push(bad); continue; } // 例如「加二1920」
      for (let v = a; v <= b; v++) {
        out.push({ book: full, abbr, chapter: chap, verse: v, tag: `${abbr}${chap}:${v}` });
      }
    }
    return out;
  }

  // 出處種類：full 書卷＋章＋節；cv 章＋節（沿用書卷）；bare 只有「N節」（沿用最靠近的前一個出處）
  function parseOutline(text) {
    const refs = [];
    let last = null; // [info, chap]

    function match(line, pos, inList) {
      const pats = [["full", FULL_RE], ["single", SINGLE_RE]];
      if (inList) pats.push(["cv", CV_RE], ["bare", BARE_RE]);
      for (const [kind, rx] of pats) {
        const m = matchAt(rx, line, pos);
        if (m) return [kind, m];
      }
      return null;
    }

    function parseList(line, start, hit) {
      let [info, chap] = last || [null, null];
      let end = start;
      while (hit) {
        const [kind, m] = hit;
        const vs = m.groups.vs;
        if (kind === "full" || kind === "single") {
          info = BOOK_MAPPING.get(m.groups.book);
          chap = kind === "single" ? 1 : cnToInt(m.groups.cn || m.groups.ar);
        } else if (kind === "cv") {
          chap = cnToInt(m.groups.cn || m.groups.ar);
        } // bare：沿用目前的 info、chap

        if (info == null || chap == null) {
          refs.push({ book: "", abbr: "", chapter: 0, verse: null, tag: m[0] });
        } else {
          refs.push(...expand(info, chap, vs));
          if (chap >= 1 && chap <= info.max) last = [info, chap];
        }

        end = endOf(m);
        const sep = matchAt(SEP_RE, line, end);
        hit = sep ? match(line, endOf(sep), true) : null;
      }
      return Math.max(end, start + 1);
    }

    function parseLine(line) {
      let i = 0;
      const n = line.length;
      while (i < n) {
        let hit = match(line, i, false);
        if (!hit && DASHES.includes(line[i])) {
          let k = i + 1;
          while (k < n && /\s/.test(line[k])) k++;
          const bm = matchAt(BARE_RE, line, k);
          if (bm) hit = ["bare", bm];
        }
        if (!hit) { i++; continue; }
        i = parseList(line, i, hit);
      }
    }

    for (const raw of text.split(/\r\n|\r|\n/)) {
      const line = raw.trim();
      if (line) parseLine(line);
    }
    return refs;
  }

  function dedupe(refs) {
    const seen = new Set();
    return refs.filter((r) => (seen.has(r.tag) ? false : (seen.add(r.tag), true)));
  }

  // 檔名 = 輸入文字的前 10 個字 + _經文擷取.txt（略過空白與檔名不能用的符號）
  function makeOutputName(text) {
    const chars = Array.from(text).filter((c) => !/\s/.test(c) && !'\\/:*?"<>|\0'.includes(c));
    return (chars.slice(0, NAME_CHARS).join("") || "output") + OUTPUT_SUFFIX;
  }

  // 清理網站上的經文文字（與 Python 的 clean_verse_text 相同）
  function cleanVerseText(raw) {
    return raw
      .replace(/[a-zA-Z]/g, "")
      .replace(/([^\d])\d+/g, "$1")
      .replace(/^\d+[:：]?\d*\s*/, "")
      .replace(/([^\x00-\x7F])\s+(?=[^\x00-\x7F])/g, "$1")
      .replace(/\s+/g, " ")
      .trim();
  }

  return {
    BOOK_MAPPING, ERR_SOURCE, ERR_SCRAPE,
    cnToInt, expand, parseOutline, dedupe, makeOutputName, cleanVerseText,
  };
});
/* PARSER-END */
</script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const { ERR_SOURCE, ERR_SCRAPE } = RV;

let running = false, stopFlag = false, nameDirty = false;
const outLines = [];

// ---------- 介面小工具 ----------
function log(msg, cls) {
  const box = $("log");
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = msg;
  box.appendChild(d);
  while (box.childElementCount > 3000) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function setRunning(on) {
  running = on;
  $("btnStart").disabled = on; $("btnStop").disabled = !on;
  $("btnParse").disabled = on; $("btnTest").disabled = on; $("input").disabled = on;
}
function refreshOutputButtons() {
  const has = outLines.length > 0;
  $("btnDownload").disabled = !has; $("btnCopy").disabled = !has;
}
function refreshName() {
  if (!nameDirty) $("fname").value = RV.makeOutputName($("input").value);
}
function getRefs() {
  let refs = RV.parseOutline($("input").value);
  if ($("dedupe").checked) refs = RV.dedupe(refs);
  return refs;
}
function addResult(line) {
  outLines.push(line);
  const ta = $("result");
  ta.value = outLines.join("\n") + "\n";
  ta.scrollTop = ta.scrollHeight;
  refreshOutputButtons();
}

// ---------- 連線 ----------
async function fetchText(url, init) {
  const proxy = $("proxy").value.trim();
  const target = proxy ? proxy + encodeURIComponent(url) : url;
  const res = await fetch(target, init);
  if (!res.ok) { const e = new Error("HTTP " + res.status); e.http = res.status; throw e; }
  return res.text();
}
const isNetworkError = (e) => e instanceof TypeError;
function explain(e) {
  if (isNetworkError(e)) {
    return "瀏覽器無法讀取該網站。最常見的原因是網站沒有開放跨網站讀取（CORS），也可能是網路中斷。" +
           "可在「連線設定」填入代理網址，或改用在網站頁面內執行的版本。";
  }
  return e.message || String(e);
}
const parseHtml = (html) => new DOMParser().parseFromString(html, "text/html");

// 自動模式：讀首頁，找出和 Python 版相同的下拉選單與表單
async function discover(site) {
  const doc = parseHtml(await fetchText(site));
  const vol = doc.querySelector("select.sel-volume");
  const chap = doc.querySelector("select.sel-chapter");
  const ver = doc.querySelector("select.sel-verse");
  if (!vol || !chap || !ver) {
    throw new Error("首頁裡找不到 select.sel-volume / sel-chapter / sel-verse。網站的下拉選單可能是用 JavaScript 動態產生，無法單靠讀取網頁取得。");
  }
  const form = vol.closest("form");
  if (!form) {
    throw new Error("下拉選單不在 <form> 內，無法組出查詢請求。請改用「自訂」模式，填入從瀏覽器開發者工具（Network 分頁）看到的查詢網址。");
  }
  return { form, vol, chap, ver, go: doc.querySelector("input.go"), site };
}

function buildRequest(d, ref) {
  const optVal = (sel, text) => {
    const o = [...sel.options].find((o) => o.textContent.trim() === text);
    return o ? o.value : text;
  };
  const params = new URLSearchParams();
  for (const el of d.form.elements) {
    if (!el.name) continue;
    if (el === d.vol) params.set(el.name, optVal(el, ref.book));
    else if (el === d.chap) params.set(el.name, optVal(el, String(ref.chapter)));
    else if (el === d.ver) params.set(el.name, optVal(el, String(ref.verse)));
    else if (["submit", "button", "image", "reset"].includes(el.type)) { if (el === d.go) params.set(el.name, el.value); }
    else if (el.type === "checkbox" || el.type === "radio") { if (el.checked) params.set(el.name, el.value); }
    else params.set(el.name, el.value);
  }
  const method = (d.form.getAttribute("method") || "get").toLowerCase();
  const action = new URL(d.form.getAttribute("action") || "", d.site).href;
  if (method === "post") {
    return { url: action, init: { method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: params.toString() } };
  }
  return { url: action + (action.includes("?") ? "&" : "?") + params.toString(), init: undefined };
}

function templateUrl(tpl, ref) {
  const vals = { book: ref.book, abbr: ref.abbr,
                 chapter: ref.chapter, verse: ref.verse };
  return tpl.replace(/\{(book|abbr|chapter|verse)\}/g, (_, k) => encodeURIComponent(vals[k]));
}

// 從回應的 HTML 取出指定節（做法與 Python 版相同）
function extractVerse(html, ref) {
  const doc = parseHtml(html);
  let text = "";
  const node = doc.getElementById("verse-" + ref.verse);
  if (node) text = (node.closest("div.v-row, div.row") || node).textContent;
  if (!text.trim()) {
    const re = new RegExp("^" + ref.chapter + "[:：]" + ref.verse + "(?!\\d)");
    for (const ln of (doc.body ? doc.body.textContent : "").split("\n")) {
      if (re.test(ln.trim())) { text = ln.trim(); break; }
    }
  }
  return text.trim() ? RV.cleanVerseText(text) : "";
}

// ---------- 動作 ----------
function doParse() {
  const refs = getRefs();
  if (!refs.length) { log("❌ 未能解析到任何經文格式。", "err"); return null; }
  const bad = refs.filter((r) => r.verse === null).length;
  log(`解析到 ${refs.length} 節（其中 ${bad} 個出處有誤）`, bad ? "warn" : "ok");
  return refs;
}

function previewParse() {
  const refs = doParse();
  if (!refs) return;
  log(refs.map((r) => (r.verse === null ? r.tag + "  ← " + ERR_SOURCE : r.tag)).join("、"), "dim");
}

async function testConnection() {
  const site = $("site").value.trim();
  log(`連線測試：${site}`);
  try {
    const d = await discover(site);
    const names = [...d.form.elements].filter((e) => e.name).map((e) => e.name).join("、");
    log(`✔ 可以讀取網站，並找到查詢表單（method=${d.form.getAttribute("method") || "get"}，欄位：${names}）`, "ok");
  } catch (e) {
    log("⚠️ " + explain(e), "err");
  }
}

async function start() {
  if (running) return;
  const refs = doParse();
  if (!refs) return;

  outLines.length = 0; $("result").value = ""; refreshOutputButtons();
  setRunning(true); stopFlag = false;
  const total = refs.length, delay = Math.max(0, +$("delay").value || 0);
  const mode = $("mode").value, site = $("site").value.trim(), tpl = $("tpl").value.trim();
  $("bar").max = total; $("bar").value = 0;
  let done = 0, okCount = 0, errCount = 0, aborted = false;
  const upd = () => {
    $("bar").value = done;
    $("statLeft").textContent = `${done} / ${total}`;
    $("statRight").textContent = `成功 ${okCount}　有誤 ${errCount}`;
  };
  upd();

  try {
    let d = null;
    if (mode === "auto") {
      log("讀取網站首頁…");
      d = await discover(site);
      log("✔ 已找到查詢表單", "ok");
    } else if (!tpl) {
      throw new Error("請先填入查詢網址樣板。");
    }

    const cache = new Map();
    for (const ref of refs) {
      if (stopFlag) { log("已停止。", "warn"); aborted = true; break; }
      const prefix = `[${done + 1}/${total}] ${ref.tag}`;

      if (ref.verse === null) {
        addResult(`${ref.tag} ${ERR_SOURCE}`); errCount++;
        log(`⚠️ ${prefix} → ${ERR_SOURCE}`, "warn");
        done++; upd(); continue;
      }

      let text = cache.get(ref.tag);
      if (text === undefined) {
        log(`${prefix} 查詢中…`, "dim");
        try {
          let html;
          if (mode === "auto") { const r = buildRequest(d, ref); html = await fetchText(r.url, r.init); }
          else html = await fetchText(templateUrl(tpl, ref));
          text = extractVerse(html, ref);
        } catch (e) {
          if (isNetworkError(e)) throw e;   // 連線層級失敗：整個中止，避免產生一堆假的「出處有誤」
          text = null;                      // 網站回應錯誤：視為查無此節
        }
        cache.set(ref.tag, text);
        if (delay) await sleep(delay);
      }

      if (text === null) { addResult(`${ref.tag} ${ERR_SOURCE}`); errCount++; log(`⚠️ ${prefix} → 網站查無此節`, "warn"); }
      else if (!text) { addResult(`${ref.tag} ${ERR_SCRAPE}`); errCount++; log(`⚠️ ${prefix} → ${ERR_SCRAPE}`, "warn"); }
      else { addResult(`${ref.tag} ${text}`); okCount++; log(`✔ ${prefix}`, "ok"); }
      done++; upd();
    }
    if (!aborted) log(`✅ 完成：成功 ${okCount} 節，有誤 ${errCount} 節。可以下載結果。`, "ok");
  } catch (e) {
    log("⚠️ 已中止：" + explain(e), "err");
  } finally {
    setRunning(false);
  }
}

function download() {
  const name = ($("fname").value.trim() || RV.makeOutputName($("input").value)).replace(/[\\/:*?"<>|]/g, "");
  const blob = new Blob([outLines.join("\n") + "\n"], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  log(`已下載：${name}`, "ok");
}

async function copyAll() {
  const text = outLines.join("\n") + "\n";
  try { await navigator.clipboard.writeText(text); log("已複製全部結果。", "ok"); }
  catch { $("result").select(); document.execCommand("copy"); log("已複製全部結果。", "ok"); }
}

// ---------- 事件 ----------
$("input").addEventListener("input", refreshName);
$("fname").addEventListener("input", () => { nameDirty = true; });
$("mode").addEventListener("change", () => { $("tplBox").hidden = $("mode").value !== "template"; });
$("btnParse").addEventListener("click", previewParse);
$("btnTest").addEventListener("click", testConnection);
$("btnStart").addEventListener("click", start);
$("btnStop").addEventListener("click", () => { stopFlag = true; });
$("btnDownload").addEventListener("click", download);
$("btnCopy").addEventListener("click", copyAll);
refreshName();
</script>
